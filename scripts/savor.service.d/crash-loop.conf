# Drop-in for savor.service, linked into ~/.config/systemd/user/savor.service.d. A crash loop stops after
# five starts in five minutes and shows up on the desktop (savor-failed.service); the kernel ending a
# browser or agent for lack of memory leaves the daemon running.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5
OnFailure=savor-failed.service

[Service]
OOMPolicy=continue
