name: Release

# Push a tag like v0.2.0 to build the desktop app for Linux, macOS and Windows and publish it as a
# GitHub release. Installed apps pick up new releases through electron-updater. The relay image goes
# to GHCR; where the repo variable COOLIFY_URL is set, the relay running in Coolify is updated too,
# reached through the tailnet (secrets TS_AUTHKEY, COOLIFY_TOKEN, COOLIFY_UUID, variable TS_LOGIN_SERVER).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Savor $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: draft
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # The terminal runs on node-pty, a native module. electron-builder ships its prebuilt binaries for
      # each platform (see extraResources in desktop/package.json); this checks they run in Electron's Node.
      - name: Check the terminal's native module
        shell: bash
        working-directory: desktop
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          npx electron -e "
            const win = process.platform === 'win32'
            const p = require('../node_modules/node-pty').spawn(win ? 'cmd.exe' : 'sh', win ? ['/c', 'echo pty ok'] : ['-c', 'echo pty ok'], {})
            let out = ''
            p.onData((d) => (out += d).includes('pty ok') && process.exit(0))
            setTimeout(() => process.exit(1), 10000)"
      - name: Use the tag as app version
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image only copies dist/, so both platforms build without emulation.
      - uses: docker/build-push-action@v7
        with:
          context: dist
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-relay:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-relay:latest

  deploy-relay:
    needs: relay
    if: vars.COOLIFY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --login-server=${{ vars.TS_LOGIN_SERVER }}
      - name: Deploy the new image
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
        run: |
          curl -fsS -X PATCH -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'content-type: application/json' \
            -d "{\"docker_registry_image_tag\": \"${GITHUB_REF_NAME#v}\"}" "$COOLIFY_URL/api/v1/applications/$COOLIFY_UUID"
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID"
