name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # knip reads the desktop shell's packages; their install scripts (Electron's download) aren't needed
      - run: npm ci --prefix desktop --ignore-scripts
      - run: npm run lint
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
