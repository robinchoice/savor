name: Secrets

# The repo is public, so every push on every branch is scanned, docs and the site
# included: this workflow has no paths-ignore. Rules: gitleaks defaults plus
# .gitleaks.toml. One short job on its own, it takes about 15 seconds.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # Branches of this repo are scanned on push already, PRs only add forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the commits the push or PR adds. Without a known base (new branch, force
      # push) it scans what is not on the default branch yet, on that branch all history.
      # --redact keeps found values out of the log, which is public too.
      - name: Scan new commits with gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT: origin/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          elif [ "$(git rev-list --count "$HEAD" --not "$DEFAULT")" -gt 0 ]; then
            range="$HEAD --not $DEFAULT"
          else
            range="$HEAD"
          fi
          echo "Scanning $range"
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --verbose --log-opts="$range"
