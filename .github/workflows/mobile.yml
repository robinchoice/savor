name: Mobile

# The iOS app (Capacitor, mobile/ios) bundles the web client and goes to TestFlight. The Android app is a
# Trusted Web Activity (Bubblewrap, mobile/android) of the relay at savor.diespaetzles.lol and goes to
# Play's internal test. Release tags hand both to the testers: the external TestFlight group
# "Savor Tester" (with the beta review) and Play's internal track. A manual run reaches only the
# TestFlight group "Savor Intern" and leaves the Android bundle as an artifact, unless `testers` is set.
# macOS minutes are free for public repos.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      testers:
        description: Hand the builds to the testers
        type: boolean
        default: false

env:
  TESTERS: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.testers }}

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build && npx cap sync ios

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Store the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8

      # A fixed development certificate for the archive. Without it, Xcode creates a new one per run
      # until the team's limit is reached. Profiles and the export stay automatic.
      - name: Install the signing certificate
        env:
          IOS_DEV_CERTIFICATE: ${{ secrets.IOS_DEV_CERTIFICATE }}
          IOS_DEV_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEV_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_DEV_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_DEV_CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Archive and upload to TestFlight
        working-directory: mobile/ios/App
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8 -authenticationKeyID ${{ vars.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ vars.ASC_ISSUER_ID }}"
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/App.xcarchive" $AUTH \
            MARKETING_VERSION=$(node -p "require('../../../package.json').version") CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist ../ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" $AUTH

  testflight:
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Hand the build to the TestFlight groups
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ "$TESTERS" = true ]; then
            node mobile/testflight.mjs "$GITHUB_RUN_NUMBER" "Savor Intern" "Savor Tester"
          else
            node mobile/testflight.mjs "$GITHUB_RUN_NUMBER" "Savor Intern"
          fi

  android:
    runs-on: ubuntu-latest
    env:
      # Repo variable PLAY_UPLOAD=true once the first bundle was uploaded by hand in the Play Console.
      PLAY: ${{ vars.PLAY_UPLOAD == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build the signed bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "Secret ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH")
          ./gradlew bundleRelease assembleRelease -PversionCode=$GITHUB_RUN_NUMBER -PversionName=$(node -p "require('../../package.json').version")
          rm "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload to Play's internal test
        if: env.TESTERS == 'true' && env.PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.pleasance.savor
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
